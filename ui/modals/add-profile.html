<!-- Modal: Add Antigravity Profile -->
<div id="modal-add-profile" class="modal-overlay">
  <div class="modal-dialog">
    <h3 style="font-size: 15px; color: var(--text-main); margin-bottom: 12px;">Create New Antigravity Profile</h3>
    <div class="form-group">
      <label class="form-label">Profile Name (e.g. Account_2):</label>
      <input type="text" id="modal-profile-name-input" class="input-text">
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
      <button class="btn btn-outline" id="btn-cancel-add-profile">Cancel</button>
      <button class="btn btn-success" id="btn-confirm-add-profile">Create Profile</button>
    </div>
  </div>
</div>
