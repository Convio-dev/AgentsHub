<!-- Modal: Add Git Worktree -->
<div id="modal-git-worktree" class="modal-overlay">
  <div class="modal-dialog" style="max-width: 520px; width: 92vw;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="color: var(--accent-cyan); width: 20px; height: 20px;"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18M3 9h18"/></svg>
        <h3 style="font-size: 15px; font-weight: 700; color: var(--text-main); margin: 0;">Add Git Worktree</h3>
      </div>
      <button class="btn-icon" id="btn-close-worktree-modal" style="font-size: 18px;">&times;</button>
    </div>

    <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 14px; line-height: 1.5;">
      Worktrees allow running independent branches concurrently in separate folders while sharing the same git history.
    </div>

    <div class="form-group" style="margin-bottom: 12px;">
      <label class="form-label" for="input-worktree-path">Worktree Folder Path:</label>
      <div style="display: flex; gap: 6px;">
        <input type="text" id="input-worktree-path" class="input-text" placeholder="C:\Projects\Worktrees\feature-x" style="flex: 1; font-family: var(--font-mono); font-size: 12px;" />
        <button class="btn btn-outline" id="btn-browse-worktree-path" type="button">Browse...</button>
      </div>
      <div class="form-hint">Directory must either not exist or be an empty folder.</div>
    </div>

    <div class="form-group" style="margin-bottom: 12px;">
      <label class="form-label" for="select-worktree-branch">Base Branch / Target:</label>
      <select id="select-worktree-branch" class="select-box" style="width: 100%;">
        <!-- Populated dynamically via JS -->
      </select>
    </div>

    <div class="form-group" style="margin-bottom: 14px;">
      <label class="checkbox-label" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <input type="checkbox" id="chk-worktree-create-branch" />
        <span>Create as a new branch from selected</span>
      </label>
      <div id="wrap-new-branch-name" style="display: none; margin-top: 8px;">
        <input type="text" id="input-worktree-new-branch" class="input-text" placeholder="new-branch-name" style="width: 100%; font-family: var(--font-mono); font-size: 12px;" />
      </div>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
      <button class="btn btn-outline" id="btn-cancel-worktree-modal" type="button">Cancel</button>
      <button class="btn btn-primary" id="btn-submit-worktree-modal" type="button">Create Worktree</button>
    </div>
  </div>
</div>
