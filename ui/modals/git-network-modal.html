<!-- Modal: Git Network Sync Confirmation (Fetch, Push, Pull) -->
<div id="modal-git-network" class="modal-overlay">
  <div class="modal-dialog" style="max-width: 520px; width: 92vw;">
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
      <svg class="icon-svg" viewBox="0 0 24 24" style="color: var(--accent-purple); width: 20px; height: 20px;"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      <h3 style="font-size: 15px; font-weight: 700; color: var(--text-main); margin: 0;" id="modal-net-title">Git Network Operation</h3>
    </div>

    <div style="background: var(--bg-input); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 10px 12px; margin-bottom: 14px; font-size: 12px;">
      <div style="margin-bottom: 4px;">Repository: <strong id="modal-net-repo-name" style="color: var(--text-main);">--</strong></div>
      <div style="color: var(--text-dim); font-size: 11px;" id="modal-net-desc">Confirm operation destination before proceeding.</div>
    </div>

    <div class="form-group" style="margin-bottom: 10px;">
      <label class="form-label" for="modal-net-remote-select">Remote:</label>
      <select id="modal-net-remote-select" class="select-box" style="width: 100%;"></select>
    </div>

    <div class="form-group" style="margin-bottom: 10px;" id="group-net-branch">
      <label class="form-label" for="modal-net-branch-input">Destination Branch:</label>
      <input type="text" id="modal-net-branch-input" class="input-text" placeholder="Branch name (e.g. main)" />
    </div>

    <div class="form-group" style="margin-bottom: 14px;" id="group-net-upstream" style="display: none;">
      <label class="checkbox-label" style="font-size: 11.5px; margin-bottom: 0;">
        <input type="checkbox" id="chk-net-set-upstream" />
        <span>Set upstream tracking for this branch (-u)</span>
      </label>
    </div>

    <div class="modal-actions" style="display: flex; justify-content: flex-end; gap: 8px;">
      <button class="btn btn-outline" id="btn-cancel-net-modal">Cancel</button>
      <button class="btn btn-primary" id="btn-confirm-net-modal">
        <span id="lbl-confirm-net-btn">Confirm</span>
      </button>
    </div>
  </div>
</div>
