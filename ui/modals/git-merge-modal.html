<!-- Modal: Git Branch Merge & Conflict Preview (Option C) -->
<div id="modal-git-merge" class="modal-overlay">
  <div class="modal-dialog" style="max-width: 580px; width: 92vw;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="color: var(--accent-cyan); width: 20px; height: 20px;"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 9v12"/><path d="M18 9a9 9 0 0 0-9 9"/></svg>
        <h3 style="font-size: 15px; font-weight: 700; color: var(--text-main); margin: 0;">Git Merge &amp; Conflict Preview</h3>
      </div>
      <button class="btn-icon" id="btn-close-merge-modal" style="font-size: 18px;">&times;</button>
    </div>

    <div style="background: var(--bg-input); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 10px 12px; margin-bottom: 14px; font-size: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>Repository: <strong id="lbl-merge-repo-name" style="color: var(--text-main);">--</strong></div>
        <div>Target (Current): <strong id="lbl-merge-target-branch" style="color: var(--accent-cyan); font-family: var(--font-mono);">--</strong></div>
      </div>
    </div>

    <div class="form-group" style="margin-bottom: 12px;">
      <label class="form-label" for="select-merge-source-branch">Source Branch to Merge Into Current:</label>
      <select id="select-merge-source-branch" class="select-box" style="width: 100%;">
        <!-- Populated dynamically via JS -->
      </select>
    </div>

    <div class="form-group" style="margin-bottom: 12px;">
      <label class="checkbox-label" style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12px;">
        <input type="checkbox" id="chk-merge-ff-only" />
        <span>Fast-forward only (--ff-only): Refuse merge if not a direct descendant</span>
      </label>
    </div>

    <!-- Merge Preview Status Box -->
    <div id="merge-preview-box" style="border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; margin-bottom: 14px; background: rgba(0,0,0,0.15);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <span style="font-size: 12px; font-weight: 700; color: var(--text-muted);">Merge Feasibility Analysis</span>
        <span id="badge-merge-status" class="badge" style="padding: 3px 8px; font-size: 11px; border-radius: 4px; font-weight: 700;">Evaluating...</span>
      </div>
      <div id="merge-analysis-msg" style="font-size: 12px; color: var(--text-dim); margin-bottom: 8px;">Select a branch to evaluate merge capability.</div>

      <!-- Incoming Commits -->
      <div style="font-size: 11px; font-weight: 600; color: var(--text-dim); margin-bottom: 4px;">Incoming Commits (<span id="lbl-merge-commits-count">0</span>):</div>
      <div id="merge-commits-list" style="max-height: 100px; overflow-y: auto; font-family: var(--font-mono); font-size: 11px; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 4px; padding: 6px; margin-bottom: 8px;">
        <div style="color: var(--text-dim);">No commits to merge.</div>
      </div>

      <!-- Conflicts or Changed Files -->
      <div id="wrap-merge-conflicts" style="display: none;">
        <div style="font-size: 11px; font-weight: 700; color: #ef4444; margin-bottom: 4px;">Conflicting Files:</div>
        <div id="merge-conflicts-list" style="max-height: 80px; overflow-y: auto; font-family: var(--font-mono); font-size: 11px; color: #f87171; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 4px; padding: 6px;"></div>
      </div>
    </div>

    <div class="form-group" style="margin-bottom: 14px;">
      <label class="form-label" for="input-merge-custom-msg">Custom Merge Commit Message (optional):</label>
      <input type="text" id="input-merge-custom-msg" class="input-text" placeholder="e.g. Merge branch 'feature-auth' into main" style="width: 100%; font-size: 12px;" />
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 8px;">
      <button class="btn btn-outline" id="btn-cancel-merge-modal" type="button">Cancel</button>
      <button class="btn btn-primary" id="btn-execute-merge-modal" type="button" disabled>
        <span id="lbl-execute-merge-btn">Execute Merge</span>
      </button>
    </div>
  </div>
</div>
