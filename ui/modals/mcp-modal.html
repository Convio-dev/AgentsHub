  <div id="modal-mcp-server" class="modal-overlay">
    <div class="modal-dialog" style="max-width: 540px;">
      <h3 style="font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 12px;">Configure MCP Server</h3>
      <input type="hidden" id="modal-mcp-id">

      <div class="form-group">
        <label class="form-label">Template Preset (Optional):</label>
        <select id="modal-mcp-template" class="select-box" style="width: 100%; font-size: 12px; padding: 6px 10px;">
          <option value="">-- Custom Server --</option>
          <option value="filesystem">Filesystem (@modelcontextprotocol/server-filesystem)</option>
          <option value="sqlite">SQLite Database (@modelcontextprotocol/server-sqlite)</option>
          <option value="github">GitHub Integration (@modelcontextprotocol/server-github)</option>
          <option value="memory">Knowledge Memory (@modelcontextprotocol/server-memory)</option>
          <option value="puppeteer">Browser Automation (@modelcontextprotocol/server-puppeteer)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Server Name:</label>
        <input type="text" id="modal-mcp-name" class="input-text" placeholder="e.g. filesystem, sqlite-db, github" />
      </div>

      <div style="display: grid; grid-template-columns: 140px 1fr; gap: 10px;">
        <div class="form-group">
          <label class="form-label">Command:</label>
          <input type="text" id="modal-mcp-cmd" class="input-text" placeholder="npx, node, python" />
        </div>
        <div class="form-group">
          <label class="form-label">Target Scope:</label>
          <select id="modal-mcp-scope" class="select-box" style="width: 100%; font-size: 12px; padding: 6px 10px;">
            <option value="Global">Global (All Agents)</option>
            <option value="ClaudeCode">Claude Code Only</option>
            <option value="Antigravity">Antigravity Only</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Command Arguments (Space-separated):</label>
        <input type="text" id="modal-mcp-args" class="input-text" placeholder="e.g. -y @modelcontextprotocol/server-filesystem C:\Projects" style="font-family: var(--font-mono); font-size: 12px;" />
      </div>

      <div class="form-group">
        <label class="form-label">Environment Variables (KEY=VALUE per line):</label>
        <textarea id="modal-mcp-env" class="input-text" style="height: 70px; font-family: var(--font-mono); font-size: 11.5px; resize: vertical;" placeholder="GITHUB_PERSONAL_ACCESS_TOKEN=ghp_..."></textarea>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
        <button class="btn btn-outline" id="btn-cancel-mcp-modal" type="button">Cancel</button>
        <button class="btn btn-primary" id="btn-save-mcp-modal" type="button" style="background: #a855f7; border-color: #a855f7; color: #fff;">Save MCP Server</button>
      </div>
    </div>
  </div>

  <!-- Modal: MCP Authentication & Key Manager -->
  <div id="modal-mcp-auth" class="modal-overlay">
    <div class="modal-dialog" style="max-width: 500px;">
      <h3 id="modal-auth-title" style="font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 12px;">Configure MCP Authentication</h3>
      <input type="hidden" id="modal-auth-server-name">
      <input type="hidden" id="modal-auth-key-name">

      <div class="mcp-auth-status-box">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
          <span id="modal-auth-server-display" style="font-size: 13px; font-weight: 700; color: var(--text-main);">Supabase</span>
          <span id="modal-auth-badge" class="badge-auth badge-auth-expired">Token Expired</span>
        </div>
        <div id="modal-auth-details" style="font-size: 11.5px; color: var(--text-dim); line-height: 1.4;">OAuth token expired. Please provide a Personal Access Token.</div>
      </div>

      <div class="form-group">
        <label class="form-label" id="modal-auth-key-label">Supabase Personal Access Token (or Service Role Key):</label>
        <div style="display: flex; gap: 6px; align-items: center;">
          <input type="password" id="modal-auth-key-input" class="input-text" placeholder="sbp_... or ey..." style="flex: 1; font-family: var(--font-mono); font-size: 12px;" />
          <button type="button" class="btn btn-outline" id="btn-toggle-auth-key-visibility" style="padding: 6px 10px; font-size: 11px;" title="Show/Hide Key">Show</button>
        </div>
        <div style="margin-top: 6px;">
          <a href="#" id="modal-auth-link" style="font-size: 11px; color: var(--accent-cyan); display: inline-flex; align-items: center; gap: 4px; text-decoration: none;">
            <span>Generate Token in Supabase Dashboard</span>
            <svg class="icon-svg" viewBox="0 0 24 24" style="width: 11px; height: 11px;"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </a>
        </div>
      </div>

      <div id="modal-auth-feedback" class="mcp-auth-feedback"></div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 18px;">
        <button class="btn btn-outline" id="btn-test-mcp-auth" type="button" style="font-size: 11.5px; padding: 6px 12px;">Test Key</button>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-outline" id="btn-close-mcp-auth" type="button">Close</button>
          <button class="btn btn-primary" id="btn-save-mcp-auth" type="button" style="background: var(--accent-cyan); border-color: var(--accent-cyan); color: #0b0f19; font-weight: 600;">Save &amp; Apply</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Custom CLI Engine Builder -->
