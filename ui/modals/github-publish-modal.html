<!-- Modal: Publish Repository to GitHub -->
<div id="modal-github-publish" class="modal-overlay">
  <div class="modal-dialog" style="max-width: 500px; width: 92vw;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="color: #f0f6fc; width: 22px; height: 22px; fill: currentColor;"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/></svg>
        <h3 style="font-size: 15px; font-weight: 700; color: var(--text-main); margin: 0;">Publish to GitHub</h3>
      </div>
      <button class="btn-icon" id="btn-close-gh-publish" style="font-size: 18px;">&times;</button>
    </div>

    <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 14px; line-height: 1.5;">
      Create a live repository on your GitHub account, configure the remote origin, and push your branch.
    </div>

    <div class="form-group" style="margin-bottom: 12px;">
      <label class="form-label" for="input-gh-repo-name">Repository Name:</label>
      <input type="text" id="input-gh-repo-name" class="input-text" placeholder="my-awesome-project" style="width: 100%; font-family: var(--font-mono); font-size: 12px;" />
    </div>

    <div class="form-group" style="margin-bottom: 12px;">
      <label class="form-label" for="input-gh-repo-desc">Description (optional):</label>
      <input type="text" id="input-gh-repo-desc" class="input-text" placeholder="Short description of this project" style="width: 100%;" />
    </div>

    <div class="form-group" style="margin-bottom: 14px;">
      <label class="form-label">Visibility:</label>
      <div style="display: flex; gap: 16px; margin-top: 4px;">
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; color: var(--text-main);">
          <input type="radio" name="gh-visibility" id="rad-gh-public" value="public" checked />
          <span>Public (visible to everyone)</span>
        </label>
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; color: var(--text-main);">
          <input type="radio" name="gh-visibility" id="rad-gh-private" value="private" />
          <span>Private</span>
        </label>
      </div>
    </div>

    <div id="gh-auth-account-badge" style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: rgba(255, 255, 255, 0.04); border-radius: 6px; margin-bottom: 16px; font-size: 11.5px; color: var(--text-muted);">
      <span class="spinner" style="width: 12px; height: 12px;"></span>
      <span>Checking GitHub account...</span>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 8px;">
      <button class="btn btn-outline" id="btn-cancel-gh-publish" type="button">Cancel</button>
      <button class="btn btn-primary" id="btn-submit-gh-publish" type="button">
        <svg class="icon-svg" viewBox="0 0 24 24" style="width: 13px; height: 13px;"><path d="M12 5v14M5 12l7-7 7 7"/></svg>
        <span>Publish &amp; Push</span>
      </button>
    </div>
  </div>
</div>
