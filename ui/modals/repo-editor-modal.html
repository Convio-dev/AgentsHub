<!-- Modal: Select External Code Editor -->
<div id="modal-repo-editor" class="modal-overlay">
  <div class="modal-dialog" style="max-width: 540px; width: 92vw;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="color: var(--accent-cyan); width: 20px; height: 20px;"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        <h3 style="font-size: 15px; font-weight: 700; color: var(--text-main); margin: 0;">Open in External Code Editor</h3>
      </div>
      <button class="btn-icon" id="btn-close-editor-modal" style="font-size: 18px;">&times;</button>
    </div>

    <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 14px;">
      Select an editor to open repository <strong id="editor-modal-repo-name" style="color: var(--text-main);">--</strong>:
    </div>

    <!-- Editors List -->
    <div class="editor-options-list" id="editor-options-container" style="display: flex; flex-direction: column; gap: 8px; max-height: 380px; overflow-y: auto; padding-right: 2px;">
      <!-- Populated dynamically via JS -->
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border-subtle); padding-top: 12px; margin-top: 12px; flex-wrap: wrap; gap: 10px;">
      <label class="checkbox-label" style="font-size: 11.5px; margin-bottom: 0;">
        <input type="checkbox" id="chk-remember-editor-choice" />
        <span>Remember my choice (don't ask again)</span>
      </label>
      <button class="btn btn-outline btn-sm" id="btn-cancel-editor-modal">Cancel</button>
    </div>
  </div>
</div>
