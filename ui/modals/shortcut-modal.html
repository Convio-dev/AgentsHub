  <div id="modal-shortcut-editor" class="modal-overlay">
    <div class="modal-dialog">
      <h3 id="modal-shortcut-title" style="font-size: 15px; color: var(--text-main); margin-bottom: 14px;">Add New Shortcut</h3>
      <input type="hidden" id="modal-shortcut-id">
      <div class="form-group">
        <label class="form-label">Quick Select from AI Dev Tools & CLIs:</label>
        <select id="modal-shortcut-preset" class="select-box">
          <option value="">-- Select from Configured Tools / CLIs (Optional) --</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Shortcut Name:</label>
        <input type="text" id="modal-shortcut-name" class="input-text" placeholder="e.g. Cursor, OpenCode, VS Code">
      </div>
      <div class="form-group">
        <label class="form-label">Category:</label>
        <select id="modal-shortcut-cat" class="select-box">
          <option value="AI Dev Tool">AI Dev Tool</option>
          <option value="CLI / Script">CLI / Script</option>
          <option value="Desktop Application">Desktop Application</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Target Executable / File Path / Command:</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="modal-shortcut-target" class="input-text" placeholder="C:\path\to\application.exe">
          <button class="btn btn-outline" id="btn-browse-modal-shortcut" style="white-space: nowrap; padding: 6px 12px;">Browse...</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Arguments (Optional):</label>
        <input type="text" id="modal-shortcut-args" class="input-text" placeholder="e.g. --profile Default">
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px;">
        <button class="btn btn-outline" id="btn-cancel-shortcut-modal">Cancel</button>
        <button class="btn btn-success" id="btn-save-shortcut-modal">Save Shortcut</button>
      </div>
    </div>
  </div>

  <!-- Modal: Add / Edit AI Dev Tool -->
