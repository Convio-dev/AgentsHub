  <div id="modal-devtool-editor" class="modal-overlay">
    <div class="modal-dialog" style="max-width: 520px;">
      <h3 id="modal-devtool-title" style="font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 14px;">Add AI Dev Tool</h3>
      <input type="hidden" id="modal-devtool-id">
      <div class="form-group">
        <label class="form-label">Tool Name:</label>
        <input type="text" id="modal-devtool-name" class="input-text" placeholder="e.g. Cursor, Devin, Zed">
      </div>
      <div class="form-group">
        <label class="form-label">Description (optional):</label>
        <input type="text" id="modal-devtool-desc" class="input-text" placeholder="Say something the name does not already say, or leave it empty">
      </div>
      <div class="form-group">
        <label class="form-label">Target Executable Path (.exe, .cmd, .bat):</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="modal-devtool-target" class="input-text" placeholder="C:\path\to\tool.exe or shell:AppsFolder\..." style="flex: 1; font-family: var(--font-mono); font-size: 12px;">
          <button class="btn btn-outline" id="btn-browse-modal-devtool" type="button" style="white-space: nowrap; padding: 6px 12px;">Browse...</button>
        </div>
        <div class="form-hint">A path copied from Explorer arrives wrapped in quotes. Those are removed for you.</div>
      </div>
      <div class="form-group">
        <label class="form-label">Arguments (optional):</label>
        <input type="text" id="modal-devtool-args" class="input-text" placeholder="e.g. --new-window --profile=work" style="font-family: var(--font-mono); font-size: 12px;">
      </div>
      <div class="form-group">
        <label class="form-label">Working directory (optional):</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="modal-devtool-workdir" class="input-text" placeholder="Leave empty to start it in the app's folder" style="flex: 1; font-family: var(--font-mono); font-size: 12px;">
          <button class="btn btn-outline" id="btn-browse-modal-devtool-workdir" type="button" style="white-space: nowrap; padding: 6px 12px;">Browse...</button>
        </div>
        <div class="form-hint">Arguments do not apply to Windows app aliases, which are handed to explorer.</div>
      </div>
      <div class="form-group" style="margin-top: 10px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap;">
        <label class="checkbox-label" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <input type="checkbox" id="modal-devtool-enabled" checked>
          <span>Active & Visible</span>
        </label>
        <label class="checkbox-label" style="display: flex; align-items: center; gap: 8px; cursor: pointer;" title="Flag this tool as an IDE / Code Editor so it appears in 'Open in External Code Editor'">
          <input type="checkbox" id="modal-devtool-is-ide">
          <span style="display: flex; align-items: center; gap: 5px;">
            <svg class="icon-svg" style="width: 13px; height: 13px; color: var(--accent-cyan);" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            <span>Flag as IDE / Code Editor</span>
          </span>
        </label>
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px;">
        <button class="btn btn-outline" id="btn-cancel-devtool-modal" type="button">Cancel</button>
        <button class="btn btn-success" id="btn-save-devtool-modal" type="button">Save Tool</button>
      </div>
    </div>
  </div>

  <!-- Modal: OpenCode Interactive Permission / Question -->
