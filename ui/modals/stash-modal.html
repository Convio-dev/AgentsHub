<!-- Modal: Create Git Stash -->
<div id="modal-git-stash" class="modal-overlay">
  <div class="modal-dialog" style="max-width: 500px; width: 92vw;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="color: var(--accent-purple); width: 20px; height: 20px;"><path d="m19 11-7-7-7 7m14 6-7-7-7 7"/></svg>
        <h3 style="font-size: 15px; font-weight: 700; color: var(--text-main); margin: 0;">Create Stash</h3>
      </div>
      <button class="btn-icon" id="btn-close-stash-modal" style="font-size: 18px;">&times;</button>
    </div>

    <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 14px; line-height: 1.5;">
      Shelve uncommitted changes into your stash drawer to cleanly work on other tasks.
    </div>

    <div class="form-group" style="margin-bottom: 12px;">
      <label class="form-label" for="input-stash-msg">Stash Message (optional):</label>
      <input type="text" id="input-stash-msg" class="input-text" placeholder="e.g. WIP on auth module before urgent bugfix" style="width: 100%;" />
    </div>

    <div class="form-group" style="margin-bottom: 16px;">
      <label class="checkbox-label" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <input type="checkbox" id="chk-stash-untracked" checked />
        <span>Include Untracked &amp; New Files (-u)</span>
      </label>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 8px;">
      <button class="btn btn-outline" id="btn-cancel-stash-modal" type="button">Cancel</button>
      <button class="btn btn-primary" id="btn-submit-stash-modal" type="button">Stash Changes</button>
    </div>
  </div>
</div>
