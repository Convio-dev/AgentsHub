<!-- Tab: Live Logs -->
<div class="dashboard-card">
  <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
    <div class="card-title-group">
      <div class="card-icon">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      </div>
      <div>
        <div class="card-title">LIVE LOGS STREAM</div>
        <div class="card-subtitle">Aggregated system events without metrics flooding</div>
      </div>
    </div>
    <button class="btn btn-outline" id="btn-clear-logs" style="padding: 4px 10px; font-size: 11.5px;">Clear Logs</button>
  </div>
  <div class="log-filter-bar" style="margin-top: 10px;">
    <button class="log-filter-pill active" data-filter="all">All</button>
    <button class="log-filter-pill" data-filter="System">System</button>
    <button class="log-filter-pill" data-filter="OpenCode">OpenCode</button>
    <button class="log-filter-pill" data-filter="WARP">Cloudflare WARP</button>
  </div>
  <div id="logs-container" style="background: var(--bg-input); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); height: 400px; padding: 12px; font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); overflow-y: auto; line-height: 1.6; margin-top: 6px;">
    <div class="log-line">
      <span class="log-time">[System]</span>
      <span class="log-tag log-tag-system">System</span>
      <span class="log-text">Agents Hub v1.0.3 active.</span>
    </div>
  </div>
</div>
