<!-- Tab: Settings & Preferences -->
<div class="dashboard-card" style="margin-bottom: 16px;">
  <div class="card-title">Theme & Appearance</div>
  <div class="form-group">
    <label class="form-label">Theme Mode:</label>
    <div style="display: flex; gap: 10px;">
      <button class="btn btn-theme-toggle" data-theme="dark">Dark Mode (Default)</button>
      <button class="btn btn-theme-toggle" data-theme="light">Light Mode</button>
    </div>
  </div>
  <div class="form-group" style="margin-top: 16px;">
    <label class="form-label">Discord Adaptive Theme (Select Preset or Enter #Hex Code):</label>
    <div style="font-size: 11.5px; color: var(--text-dim); margin-bottom: 10px;">Dynamically adapts app background, sidebar, cards, inputs, and borders for high contrast and visual hierarchy.</div>
    <div class="color-swatches" style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
      <div class="color-swatch active" data-color="#4049B9" style="background: #4049B9;" title="Discord Indigo (#4049B9)"></div>
      <div class="color-swatch" data-color="#5865f2" style="background: #5865f2;" title="Discord Blurple"></div>
      <div class="color-swatch" data-color="#10b981" style="background: #10b981;" title="Emerald Matrix"></div>
      <div class="color-swatch" data-color="#06b6d4" style="background: #06b6d4;" title="Cyan Tech"></div>
      <div class="color-swatch" data-color="#3b82f6" style="background: #3b82f6;" title="Sapphire Blue"></div>
      <div class="color-swatch" data-color="#8b5cf6" style="background: #8b5cf6;" title="Deep Violet"></div>
      <div class="color-swatch" data-color="#ec4899" style="background: #ec4899;" title="Cyberpunk Rose"></div>
      <div class="color-swatch" data-color="#f59e0b" style="background: #f59e0b;" title="Warm Amber"></div>
      <div class="color-swatch" data-color="#e11d48" style="background: #e11d48;" title="Crimson Red"></div>
      <div class="color-swatch" data-color="#313338" style="background: #313338;" title="Discord Charcoal"></div>
      <div style="display: flex; gap: 8px; align-items: center; margin-left: 6px;">
        <input type="color" id="accent-color-picker" value="#4049B9" style="width: 32px; height: 32px; border: none; border-radius: 4px; cursor: pointer; background: transparent;">
        <input type="text" id="accent-hex-input" class="input-text" style="width: 115px; font-family: var(--font-mono); text-transform: uppercase;" value="#4049B9" placeholder="#RRGGBB">
        <button class="btn btn-outline" id="btn-apply-custom-color" style="padding: 6px 12px;">Apply Code #</button>
      </div>
    </div>
    <div style="margin-top: 14px; max-width: 380px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <span style="font-size: 12px; font-weight: 600; color: var(--text-muted);">Color Intensity:</span>
        <span id="theme-intensity-val" style="font-size: 12px; font-family: var(--font-mono); font-weight: 700; color: var(--accent-green);">74%</span>
      </div>
      <input type="range" id="theme-intensity-slider" min="10" max="100" value="74" style="width: 100%; accent-color: var(--accent-green); cursor: pointer;">
    </div>
  </div>
</div>

<div class="dashboard-card">
  <div class="card-title">Startup & System Preferences</div>
  <div style="display: flex; flex-direction: column; gap: 10px;">
    <label class="checkbox-label">
      <input type="checkbox" id="setting-autostart-checkbox">
      <span>Launch Agents Hub on Windows Startup</span>
    </label>
    <label class="checkbox-label">
      <input type="checkbox" id="setting-minimized-checkbox">
      <span>Start Minimized to System Tray on Launch</span>
    </label>
    <label class="checkbox-label">
      <input type="checkbox" id="setting-tray-minimize-checkbox" checked>
      <span>Enable Minimize to System Tray (Keep running in background when closed or minimized)</span>
    </label>
    <label class="checkbox-label">
      <input type="checkbox" id="setting-notifications-checkbox" checked>
      <span>Enable Windows Notifications (Balloon Tips & System Tray Alerts)</span>
    </label>
    <label class="checkbox-label">
      <input type="checkbox" id="setting-mask-paths-checkbox">
      <span>Hide / Mask File Target Paths on Dashboard (Show as **)</span>
    </label>
    <label class="checkbox-label">
      <input type="checkbox" id="setting-embed-shells-checkbox">
      <span>Open CMD & PowerShell Terminals inside CLI Workspace Window</span>
    </label>
    <div class="preference-item flex items-center justify-between py-2">
      <label for="pref-enable-proton" class="text-sm font-medium">
        Enable Proton VPN Provider (Secondary / Experimental)
        <span class="block text-xs text-muted">Show Proton VPN tab in OpenCode Quota card for manual geo-routing.</span>
      </label>
      <input type="checkbox" id="pref-enable-proton" class="form-checkbox">
    </div>
    <div class="preference-item flex items-center justify-between py-2">
      <label for="pref-enable-hardware-monitor" class="text-sm font-medium">
        Enable System &amp; Hardware Telemetry Monitor
        <span class="block text-xs text-muted">Show real-time CPU &amp; RAM resource monitor with charts on Dashboard.</span>
      </label>
      <input type="checkbox" id="pref-enable-hardware-monitor" class="form-checkbox">
    </div>
  </div>
</div>
