        <!-- VIEW 2: Interactive Terminals -->
        <div id="view-terminals" class="view-pane" style="height: 100%;">
          <div id="terminals-view">
            <!-- Workspace presets -->
            <div class="terminal-preset-bar">
              <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                <span style="font-size: 11.5px; font-weight: 600; color: var(--text-muted);">Workspace Presets:</span>
                <div id="terminal-presets-group" style="display: flex; gap: 6px; flex-wrap: wrap;">
                  <button class="btn btn-outline preset-btn" data-preset="Preset_Clean" title="Zero tabs by default (clean slate)" style="padding: 4px 10px; font-size: 11.5px;">Clean Slate</button>
                  <button class="btn btn-outline preset-btn" data-preset="Preset_Duo" title="Claude Code + Antigravity CLI" style="padding: 4px 10px; font-size: 11.5px;">AI Duo (Claude + agy)</button>
                  <button class="btn btn-outline preset-btn" data-preset="Preset_All" title="All CLIs (Hermes + Claude + agy)" style="padding: 4px 10px; font-size: 11.5px;">Full Suite</button>
                </div>
              </div>
              <span id="preset-active-label" style="font-size: 11.5px; color: var(--text-muted);">Active: AI Duo (Claude + agy)</span>
            </div>
            <!-- Workspace Checkpoints & Time-Machine Toolbar -->
            <div class="terminal-checkpoint-bar" style="display: flex; align-items: center; justify-content: space-between; padding: 6px 14px; background: rgba(0,0,0,0.22); border-bottom: 1px solid var(--border-subtle); gap: 10px; flex-wrap: wrap;">
              <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                <div style="display: flex; align-items: center; gap: 5px;">
                  <svg class="icon-svg" viewBox="0 0 24 24" style="width: 14px; height: 14px; color: var(--accent-cyan);"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 14 14"/></svg>
                  <span style="font-size: 11.5px; font-weight: 600; color: var(--text-muted);">Checkpoints:</span>
                </div>
                <select id="checkpoint-select" class="select-box" style="padding: 3px 8px; font-size: 11.5px; max-width: 260px; height: 26px;">
                  <option value="">No snapshots recorded</option>
                </select>
                <button class="btn btn-outline" id="btn-create-checkpoint" type="button" title="Create Shadow Snapshot of Workspace" style="padding: 2px 8px; font-size: 11px; display: inline-flex; align-items: center; gap: 4px;">
                  <svg class="icon-svg" viewBox="0 0 24 24" style="width: 12px; height: 12px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  <span>Snapshot</span>
                </button>
                <button class="btn btn-outline" id="btn-rollback-checkpoint" type="button" title="Rollback Workspace to selected checkpoint" style="padding: 2px 8px; font-size: 11px; color: var(--accent-amber); border-color: rgba(245,158,11,0.3); display: inline-flex; align-items: center; gap: 4px;">
                  <svg class="icon-svg" viewBox="0 0 24 24" style="width: 12px; height: 12px;"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                  <span>Rollback</span>
                </button>
                <button class="btn btn-outline" id="btn-delete-checkpoint" type="button" title="Delete selected checkpoint" style="padding: 2px 6px; font-size: 11px; color: var(--accent-red); border-color: rgba(239,68,68,0.3);">
                  <svg class="icon-svg" viewBox="0 0 24 24" style="width: 12px; height: 12px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
              </div>
              <div style="display: flex; align-items: center; gap: 8px;">
                <button class="btn btn-outline" id="btn-run-security-gatekeeper" type="button" title="Pre-Commit Security Audit (Secrets & Guardrails)" style="padding: 2px 9px; font-size: 11px; display: inline-flex; align-items: center; gap: 5px;">
                  <svg class="icon-svg" viewBox="0 0 24 24" style="width: 12px; height: 12px; color: var(--accent-green);"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                  <span>Security Audit</span>
                  <span class="security-score-badge" id="security-score-badge" style="font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 3px; background: rgba(16,185,129,0.15); color: #10b981;">100/100</span>
                </button>
              </div>
            </div>
            <div class="terminal-tabs-bar">
              <div class="terminal-tabs" id="interactive-terminal-tabs">
                <button class="term-tab active" data-term="hermes">
                  <svg class="icon-svg" style="width: 14px; height: 14px;" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                  <span>Hermes Web</span>
                </button>
                <button class="term-tab" data-term="claude_code">
                  <svg class="icon-svg" style="width: 14px; height: 14px;" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
                  <span>Claude Code</span>
                </button>
                <button class="term-tab" data-term="antigravity_cli">
                  <svg class="icon-svg" style="width: 14px; height: 14px;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                  <span>Antigravity CLI</span>
                </button>
              </div>
              <div style="display: flex; gap: 6px; align-items: center;">
                <button class="btn btn-outline" style="padding: 4px 8px; font-size: 11px; display: inline-flex; align-items: center; gap: 4px;" id="btn-ptt-mic" title="Push-to-Talk Voice Commander (Dictate speech into active CLI)">
                  <svg class="icon-svg" viewBox="0 0 24 24" style="width: 13px; height: 13px;"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                  <span id="ptt-btn-label">PTT Mic</span>
                </button>
                <button class="btn btn-outline" style="padding: 4px 8px; font-size: 11px; display: inline-flex; align-items: center; gap: 4px;" id="btn-timelapse-record" title="Proof-of-Work Timelapse Recorder (Record terminal session clip)">
                  <svg class="icon-svg" viewBox="0 0 24 24" style="width: 13px; height: 13px; color: var(--accent-red);"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
                  <span id="timelapse-btn-label">Record Clip</span>
                </button>
                <button class="btn btn-outline" style="padding: 4px 8px; font-size: 11.5px;" id="btn-popout-terminals" title="Standalone Window">
                  <svg class="icon-svg" style="width: 13px; height: 13px;" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                  <span>Popout</span>
                </button>
                <button class="btn btn-outline" style="padding: 4px 8px; font-size: 11.5px;" id="btn-clear-terminal">Clear</button>
                <button class="btn btn-outline" style="padding: 4px 8px; font-size: 11.5px;" id="btn-term-open-browser">External</button>
              </div>
            </div>
            <div id="terminal-host">
              <iframe id="terminal-web-frame" class="hidden" title="Hermes web dashboard"></iframe>
              <div id="term-panes-wrapper"></div>
              <div id="terminal-offline-overlay" class="terminal-overlay hidden" aria-live="polite">
                <div class="terminal-offline-card">
                  <span class="terminal-offline-badge" id="terminal-offline-badge">Offline</span>
                  <h3 id="terminal-offline-title">Session not running</h3>
                  <p id="terminal-offline-status">This CLI is stopped.</p>
                  <button type="button" class="btn btn-success" id="btn-terminal-start-cli">Start session</button>
                </div>
              </div>
            </div>
          </div>
        </div>
