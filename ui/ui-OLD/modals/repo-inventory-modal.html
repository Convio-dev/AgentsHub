<!-- Modal: Inventory Issues & Problematic Repositories -->
<div id="modal-repo-inventory" class="modal-overlay">
  <div class="modal-dialog" style="max-width: 680px; width: 92vw;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="color: #f59e0b; width: 20px; height: 20px;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <h3 style="font-size: 15px; font-weight: 700; color: var(--text-main); margin: 0;">Inventory Diagnostics &amp; Issues</h3>
      </div>
      <button class="btn-icon" id="btn-close-repo-inventory" style="font-size: 18px;">&times;</button>
    </div>

    <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 12px;">
      Repositories that are inaccessible, missing from disk, or encounter Git reading errors:
    </div>

    <div id="repo-issues-list" style="max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px;">
      <div class="empty-state" style="padding: 30px; text-align: center; color: var(--text-dim);">
        No inventory issues detected. All scanned repositories are valid and accessible.
      </div>
    </div>

    <div class="modal-actions" style="display: flex; justify-content: flex-end; gap: 8px;">
      <button class="btn btn-outline" id="btn-close-inventory-issues">Close</button>
    </div>
  </div>
</div>
