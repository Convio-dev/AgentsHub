<!-- Modal: Add Custom Project Launcher -->
<div id="modal-repo-launcher" class="modal-overlay">
  <div class="modal-dialog" style="max-width: 520px; width: 92vw;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="color: var(--accent-green); width: 20px; height: 20px;"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <h3 style="font-size: 15px; font-weight: 700; color: var(--text-main); margin: 0;">Add Custom Launcher</h3>
      </div>
      <button class="btn-icon" id="btn-close-launcher-modal" style="font-size: 18px;">&times;</button>
    </div>

    <div class="form-group" style="margin-bottom: 10px;">
      <label class="form-label" for="input-launcher-label">Display Label:</label>
      <input type="text" id="input-launcher-label" class="input-text" placeholder="e.g. Build Production, Start Dev Server" />
    </div>

    <div class="form-group" style="margin-bottom: 10px;">
      <label class="form-label" for="input-launcher-cmd">Executable / Command:</label>
      <input type="text" id="input-launcher-cmd" class="input-text" placeholder="e.g. npm, python, cargo, powershell.exe" />
    </div>

    <div class="form-group" style="margin-bottom: 14px;">
      <label class="form-label" for="input-launcher-args">Arguments:</label>
      <input type="text" id="input-launcher-args" class="input-text" placeholder="e.g. run build, main.py --port 5000" />
      <span class="form-hint">Arguments separated by spaces. Working directory defaults to repository root.</span>
    </div>

    <div class="modal-actions" style="display: flex; justify-content: flex-end; gap: 8px;">
      <button class="btn btn-outline" id="btn-cancel-launcher-modal">Cancel</button>
      <button class="btn btn-primary" id="btn-save-launcher-modal">Save Launcher</button>
    </div>
  </div>
</div>
