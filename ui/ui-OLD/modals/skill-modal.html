        </div>
      </div>

      <input type="hidden" id="modal-skill-scope">
      <input type="hidden" id="modal-skill-wsid">

      <!-- Scope notice bar -->
      <div id="modal-skill-scope-banner" style="background: var(--bg-input); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; font-size: 11.5px; display: flex; align-items: center; justify-content: space-between; gap: 8px;">
        <span id="modal-skill-scope-desc" style="color: var(--text-dim);">Skill Information</span>
        <button type="button" class="btn btn-outline" id="btn-modal-skill-jump-ws" style="display: none; padding: 2px 8px; font-size: 10.5px; color: var(--accent-cyan); border-color: rgba(6,182,212,0.3); cursor: pointer;">
          Switch to Workspace
        </button>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label" for="modal-skill-name">Skill Identifier / Name:</label>
          <input type="text" id="modal-skill-name" class="input-text" />
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label" for="modal-skill-desc">Summary Description:</label>
          <input type="text" id="modal-skill-desc" class="input-text" />
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 10px;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
          <label class="form-label" style="margin-bottom: 0;">Skill Source Location:</label>

              <svg class="icon-svg" viewBox="0 0 24 24" style="width: 12px; height: 12px;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
              <span>Explorer</span>
            </button>
            <button type="button" class="btn btn-outline" id="btn-skill-open-editor" title="Open in External Code Editor" style="padding: 2px 7px; font-size: 10.5px; display: inline-flex; align-items: center; gap: 4px;">
              <svg class="icon-svg" viewBox="0 0 24 24" style="width: 12px; height: 12px;"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>

      </div>

      <div class="form-group" style="margin-bottom: 14px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <label class="form-label" for="modal-skill-content" style="margin-bottom: 0;">Directives &amp; Execution Guidelines (SKILL.md):</label>

        <textarea id="modal-skill-content" class="input-text" rows="13" style="font-family: var(--font-mono); font-size: 12px; resize: vertical; line-height: 1.5;"></textarea>
      </div>

      <div class="modal-actions" style="display: flex; justify-content: space-between; align-items: center;">
        <button class="btn btn-danger hidden" id="btn-modal-delete-skill" type="button">Delete Skill</button>
        <button class="btn btn-primary hidden" id="btn-modal-fork-skill" type="button" style="background: #38bdf8; border-color: #38bdf8; color: #0b0f19; font-weight: 700; display: inline-flex; align-items: center; gap: 6px;">

          <span>Fork to Workspace (Customize)</span>
        </button>
        <div style="display: flex; gap: 8px; margin-left: auto;">
          <button class="btn btn-outline" id="btn-modal-close-skill" type="button">Close</button>
          <button class="btn btn-primary" id="btn-modal-save-skill" type="button" style="background: #10b981; border-color: #10b981; color: #fff; font-weight: 700;">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Create New Agent Skill -->
  <div id="modal-add-skill" class="modal-overlay">

      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="color: #38bdf8; width: 18px; height: 18px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <h3 style="font-size: 15px; font-weight: 700; color: var(--text-main); margin: 0;">Create New Project Skill</h3>
      </div>

      <div style="background: var(--bg-input); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; font-size: 11.5px; color: var(--text-dim);">
        Target Workspace: <code id="modal-add-skill-workdir" style="color: var(--accent-cyan); word-break: break-all;">--</code>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label" for="modal-add-skill-name">Skill Identifier / Slug:</label>
          <input type="text" id="modal-add-skill-name" class="input-text" placeholder="e.g. database-migrator, test-generator" />
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label" for="modal-add-skill-desc">Summary Description:</label>
          <input type="text" id="modal-add-skill-desc" class="input-text" placeholder="Brief summary of agent capability" />
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 14px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <label class="form-label" for="modal-add-skill-content" style="margin-bottom: 0;">Skill Directives (SKILL.md):</label>
          <span style="font-size: 11px; color: var(--text-dim);">Standard markdown documentation</span>

        <textarea id="modal-add-skill-content" class="input-text" rows="11" style="font-family: var(--font-mono); font-size: 12px; resize: vertical; line-height: 1.5;" placeholder="# Skill Name&#10;&#10;## Overview&#10;Describe when and how agents should use this capability.&#10;&#10;## Instructions&#10;- Guideline 1&#10;- Guideline 2"></textarea>

      <div class="modal-actions" style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn btn-outline" id="btn-cancel-add-skill" type="button">Cancel</button>
        <button class="btn btn-primary" id="btn-save-add-skill" type="button" style="background: #38bdf8; border-color: #38bdf8; color: #0b0f19; font-weight: 700;">Create Skill</button>
      </div>
    </div>
