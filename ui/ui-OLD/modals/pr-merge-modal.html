<!-- Modal: Merge GitHub Pull Request -->
<div id="modal-pr-merge" class="modal-overlay">
  <div class="modal-dialog" style="max-width: 520px; width: 92vw;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="color: var(--accent-cyan); width: 20px; height: 20px;"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><line x1="6" y1="9" x2="6" y2="21"/></svg>
        <h3 style="font-size: 15px; font-weight: 700; color: var(--text-main); margin: 0;" id="pr-merge-modal-title">Merge Pull Request</h3>
      </div>
      <button class="btn-icon" id="btn-close-pr-merge-modal" style="font-size: 18px;">&times;</button>
    </div>

    <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 14px; line-height: 1.5;" id="pr-merge-modal-desc">
      Choose a merge strategy to merge this pull request into the base branch.
    </div>

    <input type="hidden" id="pr-merge-pr-number" value="" />

    <div class="form-group" style="margin-bottom: 12px;">
      <label class="form-label" for="select-pr-merge-method">Merge Method:</label>
      <select id="select-pr-merge-method" class="select-box" style="width: 100%;">
        <option value="merge">Create a merge commit (all commits preserved)</option>
        <option value="squash">Squash and merge (combine commits into one)</option>
        <option value="rebase">Rebase and merge (rebase commits onto base)</option>
      </select>
    </div>

    <div class="form-group" style="margin-bottom: 12px;">
      <label class="form-label" for="input-pr-merge-title">Commit Title (optional):</label>
      <input type="text" id="input-pr-merge-title" class="input-text" placeholder="Defaults to PR title and number" style="width: 100%;" />
    </div>

    <div class="form-group" style="margin-bottom: 16px;">
      <label class="form-label" for="input-pr-merge-message">Commit Message / Extended Description (optional):</label>
      <textarea id="input-pr-merge-message" class="commit-msg-input" rows="3" placeholder="Additional details for the merge commit..."></textarea>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 8px;">
      <button class="btn btn-outline" id="btn-cancel-pr-merge-modal" type="button">Cancel</button>
      <button class="btn btn-primary" id="btn-submit-pr-merge-modal" type="button" style="background: var(--accent-green); border-color: var(--accent-green);">Confirm Merge</button>
    </div>
  </div>
</div>
