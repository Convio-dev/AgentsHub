  <div id="modal-automation-task" class="modal-overlay">
    <div class="modal-dialog" style="max-width: 580px; width: 92vw;">
      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 14px;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="color: #8b5cf6; width: 18px; height: 18px;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 14 14"/></svg>
        <h3 id="modal-auto-task-header" style="font-size: 15px; font-weight: 700; color: var(--text-main); margin: 0;">Configure Automation Task</h3>
      </div>

      <input type="hidden" id="modal-auto-task-id" />

      <div class="form-group">
        <label class="form-label" for="modal-auto-task-name">Task Name:</label>
        <input type="text" id="modal-auto-task-name" class="input-text" placeholder="e.g. Unit Tests &amp; Lint Check, Nightly Git Summary" />
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;">
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label" for="modal-auto-task-cli">Target Agent CLI:</label>
          <select id="modal-auto-task-cli" class="select-box">
            <option value="claude_code">Claude Code</option>
            <option value="antigravity_cli">Antigravity CLI (agy)</option>
            <option value="hermes">Hermes Agent</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label" for="modal-auto-task-interval">Run Frequency / Schedule:</label>
          <select id="modal-auto-task-interval" class="select-box">
            <option value="*/15 * * * *">Every 15 Minutes</option>
            <option value="*/30 * * * *" selected>Every 30 Minutes</option>
            <option value="0 * * * *">Hourly (Every Hour)</option>
            <option value="0 */2 * * *">Every 2 Hours</option>
            <option value="0 */6 * * *">Every 6 Hours</option>
            <option value="0 9 * * *">Daily at 9:00 AM</option>
            <option value="0 0 * * *">Daily at Midnight</option>
            <option value="0 9 * * 1">Weekly on Monday (9:00 AM)</option>
            <option value="custom">Custom Cron Expression...</option>
          </select>
        </div>
      </div>

      <!-- Human-friendly translation banner -->
      <div id="modal-auto-schedule-desc" style="font-size: 11.5px; color: #a855f7; background: rgba(139,92,246,0.08); border: 1px solid rgba(139,92,246,0.22); border-radius: 6px; padding: 6px 10px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="width: 13px; height: 13px; flex-shrink: 0;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 14 14"/></svg>
        <span id="modal-auto-schedule-desc-text">Runs automatically every 30 minutes.</span>
      </div>

      <!-- Custom Cron Input (hidden unless custom selected) -->
      <div id="modal-auto-task-custom-wrap" style="display: none; margin-bottom: 12px;">
        <label class="form-label" for="modal-auto-task-cron">Cron Expression (minute hour day month day-of-week):</label>
        <input type="text" id="modal-auto-task-cron" class="input-text" value="*/30 * * * *" placeholder="e.g. */15 * * * *" style="font-family: var(--font-mono); font-size: 12px;" />
        <div class="form-hint" style="font-size: 10.5px; color: var(--text-dim); margin-top: 3px;">Format: 5 fields separated by spaces (* = any). Example: <code>0 9 * * *</code> = 9 AM daily.</div>
      </div>

      <div class="form-group" style="margin-bottom: 14px;">
        <label class="form-label" for="modal-auto-task-prompt">Command / Prompt to Dispatch:</label>
        <textarea id="modal-auto-task-prompt" class="input-text" rows="4" style="font-family: var(--font-mono); font-size: 12px; resize: vertical;" placeholder="e.g. Run dotnet test and report any failing assertions"></textarea>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <label style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--text-main);">
          <input type="checkbox" id="modal-auto-task-enabled" checked style="accent-color: #8b5cf6;" />
          <span>Active (Automated Evaluation Enabled)</span>
        </label>
      </div>

      <div class="modal-actions" style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn btn-outline" id="btn-cancel-auto-task" type="button">Cancel</button>
        <button class="btn btn-primary" id="btn-save-auto-task" type="button" style="background: #8b5cf6; border-color: #8b5cf6; color: #fff; font-weight: 700;">Save Task</button>
      </div>
    </div>
  </div>

  <!-- Modal: Confirm Delete Agent Session -->
