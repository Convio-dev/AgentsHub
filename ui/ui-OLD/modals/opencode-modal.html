  <div id="modal-opencode-prompt" class="modal-overlay">
    <div class="modal-dialog" style="max-width: 520px;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 18px;" id="opencode-prompt-icon">⚠️</span>
          <div>
            <h3 id="opencode-prompt-title" style="font-size: 15px; font-weight: 700; color: var(--text-main); margin: 0;">OpenCode Permission Requested</h3>
            <span id="opencode-prompt-type" style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent-amber, #f59e0b); font-weight: 600;">Tool Execution</span>
          </div>
        </div>
        <span id="opencode-prompt-time" style="font-size: 11px; color: var(--text-dim, #94a3b8); font-family: var(--font-mono);">Just now</span>
      </div>
      
      <div id="opencode-prompt-body" style="font-size: 13px; color: var(--text-main); margin-bottom: 12px; line-height: 1.5;">
        The agent is requesting permission to execute the following command or access resources:
      </div>

      <div id="opencode-prompt-command-box" style="background: rgba(0,0,0,0.35); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 10px 12px; font-family: var(--font-mono); font-size: 12px; color: #38bdf8; overflow-x: auto; max-height: 160px; margin-bottom: 16px; word-break: break-all; white-space: pre-wrap;">
        <code id="opencode-prompt-command">npm run test</code>
      </div>

      <div id="opencode-prompt-input-group" style="display: none; margin-bottom: 14px;">
        <label class="form-label" for="opencode-prompt-input">Your Response / Answer:</label>
        <input type="text" id="opencode-prompt-input" class="input-text" placeholder="Type your answer here..." />
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px; align-items: center;">
        <button class="btn btn-outline" id="btn-reject-opencode-prompt" style="color: #f87171; border-color: rgba(248, 113, 113, 0.4); padding: 7px 16px; font-weight: 600;">
          ✕ Reject / Deny
        </button>
        <button class="btn btn-success" id="btn-approve-opencode-prompt" style="background: #10b981; padding: 7px 18px; font-weight: 600;">
          ✓ Approve / Yes
        </button>
      </div>
    </div>
  </div>

  <!-- Floating Workspace File Watchdog Pill -->
  <div id="file-watchdog-pill" class="file-watchdog-floating-pill" style="display: none;">
    <div class="pill-dot"></div>
    <span class="pill-text" id="file-watchdog-pill-text">0 workspace files modified</span>
    <svg class="icon-svg pill-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><polyline points="14 2 14 8 20 8"/></svg>
    <button type="button" id="btn-close-watchdog-pill" class="pill-close-btn" title="Dismiss" aria-label="Dismiss notification">
      <svg class="icon-svg" viewBox="0 0 24 24" style="width: 12px; height: 12px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
