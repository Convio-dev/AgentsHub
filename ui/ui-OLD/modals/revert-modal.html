<!-- Modal: Revert Commit & Branching -->
<div id="modal-revert-commit" class="modal-overlay">
  <div class="modal-dialog" style="max-width: 530px; width: 92vw;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="color: var(--accent-cyan); width: 20px; height: 20px;"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        <h3 style="font-size: 15px; font-weight: 700; color: var(--text-main); margin: 0;">Revert Commit</h3>
      </div>
      <button class="btn-icon" id="btn-close-revert-modal" style="font-size: 18px;" type="button">&times;</button>
    </div>

    <!-- Target Commit Summary Card -->
    <div style="background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
        <span id="revert-modal-hash" style="font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; color: var(--accent-cyan); background: rgba(6, 182, 212, 0.1); padding: 2px 6px; border-radius: 4px;"></span>
        <span id="revert-modal-date" style="font-size: 11px; color: var(--text-dim);"></span>
      </div>
      <div id="revert-modal-subject" style="font-size: 12.5px; font-weight: 600; color: var(--text-main); line-height: 1.4; margin-bottom: 4px; word-break: break-word;"></div>
      <div id="revert-modal-author" style="font-size: 11px; color: var(--text-muted);"></div>
    </div>

    <!-- Pre-Flight Cleanliness Guard -->
    <div id="revert-modal-status-box" style="padding: 8px 10px; border-radius: 6px; margin-bottom: 14px; font-size: 11.5px; display: flex; align-items: center; gap: 8px; background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.2); color: #34d399;">
      <svg class="icon-svg" style="width: 14px; height: 14px; flex-shrink: 0;" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      <span id="revert-modal-status-text">Working tree is clean. Safe to revert.</span>
    </div>

    <!-- Strategy Selection -->
    <div style="margin-bottom: 16px;">
      <div style="font-size: 11.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px;">Select Action Strategy:</div>

      <!-- Option 1: Revert on New Branch (Default) -->
      <label class="revert-strategy-card active" id="label-strat-new-branch" style="display: block; padding: 10px 12px; border: 1px solid var(--accent-cyan); background: rgba(6, 182, 212, 0.06); border-radius: 6px; margin-bottom: 8px; cursor: pointer; transition: all 0.15s ease;">
        <div style="display: flex; align-items: flex-start; gap: 8px;">
          <input type="radio" name="revert-strategy" id="radio-revert-new-branch" value="new_branch" checked style="margin-top: 3px; accent-color: var(--accent-cyan);" />
          <div style="flex: 1;">
            <div style="font-size: 12.5px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 6px;">
              <span>Revert on New Branch</span>
              <span style="font-size: 10px; padding: 1px 5px; border-radius: 8px; background: rgba(16, 185, 129, 0.2); color: #34d399; font-weight: 600;">Recommended</span>
            </div>
            <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">Creates a dedicated branch and applies the revert there without touching your active branch.</div>
            <div id="wrap-revert-new-branch-input" style="margin-top: 8px;">
              <input type="text" id="input-revert-branch-name" class="input-text" placeholder="revert-branch-name" style="width: 100%; font-family: var(--font-mono); font-size: 12px;" />
            </div>
          </div>
        </div>
      </label>

      <!-- Option 2: Revert on Current Branch -->
      <label class="revert-strategy-card" id="label-strat-current" style="display: block; padding: 10px 12px; border: 1px solid var(--border-subtle); background: rgba(255, 255, 255, 0.02); border-radius: 6px; margin-bottom: 8px; cursor: pointer; transition: all 0.15s ease;">
        <div style="display: flex; align-items: flex-start; gap: 8px;">
          <input type="radio" name="revert-strategy" id="radio-revert-current" value="current" style="margin-top: 3px; accent-color: var(--accent-cyan);" />
          <div style="flex: 1;">
            <div style="font-size: 12.5px; font-weight: 700; color: var(--text-main);">
              <span>Revert on Current Branch (<strong id="revert-modal-current-branch-label">main</strong>)</span>
            </div>
            <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">Applies an inverse commit directly onto your active working branch.</div>
          </div>
        </div>
      </label>

      <!-- Option 3: Branch Off Commit -->
      <label class="revert-strategy-card" id="label-strat-branch-only" style="display: block; padding: 10px 12px; border: 1px solid var(--border-subtle); background: rgba(255, 255, 255, 0.02); border-radius: 6px; cursor: pointer; transition: all 0.15s ease;">
        <div style="display: flex; align-items: flex-start; gap: 8px;">
          <input type="radio" name="revert-strategy" id="radio-strat-branch-only" value="branch_only" style="margin-top: 3px; accent-color: var(--accent-cyan);" />
          <div style="flex: 1;">
            <div style="font-size: 12.5px; font-weight: 700; color: var(--text-main);">
              <span>Branch Off This Commit</span>
            </div>
            <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">Creates and checks out a new branch pointing directly to this historical commit.</div>
            <div id="wrap-branch-only-input" style="display: none; margin-top: 8px;">
              <input type="text" id="input-branch-only-name" class="input-text" placeholder="branch-name" style="width: 100%; font-family: var(--font-mono); font-size: 12px;" />
            </div>
          </div>
        </div>
      </label>
    </div>

    <!-- Safety Hint -->
    <div style="font-size: 11px; color: var(--text-dim); margin-bottom: 16px; display: flex; align-items: center; gap: 6px;">
      <svg class="icon-svg" style="width: 12px; height: 12px; flex-shrink: 0;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <span>Conflict protection: If conflicts arise with newer commits, the operation automatically aborts cleanly.</span>
    </div>

    <!-- Actions -->
    <div style="display: flex; justify-content: flex-end; gap: 8px;">
      <button class="btn btn-outline" id="btn-cancel-revert-modal" type="button">Cancel</button>
      <button class="btn btn-primary" id="btn-submit-revert-modal" type="button">
        <svg class="icon-svg" style="width: 13px; height: 13px;" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        <span id="lbl-submit-revert">Revert on New Branch</span>
      </button>
    </div>
  </div>
</div>
