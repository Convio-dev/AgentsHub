  <div id="modal-workspace" class="modal-overlay">
    <div class="modal-dialog" style="max-width: 540px;">
      <h3 id="modal-ws-title" style="font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 14px;">Edit Project Workspace</h3>
      <input type="hidden" id="modal-ws-id">
      <div class="form-group">
        <label class="form-label">Workspace Name:</label>
        <input type="text" id="modal-ws-name" class="input-text" placeholder="e.g. AgentsHub Dev, Client Portal">
      </div>
      <div class="form-group">
        <label class="form-label">Accent Color:</label>
        <div id="modal-ws-color-palette" style="display: flex; gap: 8px; align-items: center; margin-top: 4px;"></div>
        <input type="hidden" id="modal-ws-color" value="#06b6d4">
      </div>
      <div class="form-group">
        <label class="form-label">Project Working Directory:</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="modal-ws-dir" class="input-text" placeholder="C:\Projects\MyProject" style="flex: 1; font-family: var(--font-mono); font-size: 12px;">
          <button class="btn btn-outline" id="btn-browse-modal-ws-dir" type="button" style="white-space: nowrap; padding: 6px 12px;">Browse...</button>
        </div>
        <div class="form-hint">Terminals and CLI tools will launch inside this project root.</div>
      </div>
      <div class="form-group">
        <label class="form-label">Associated Antigravity Profile:</label>
        <select id="modal-ws-profile" class="select-box"></select>
        <div class="form-hint">Auto-switches Google AI Pro credentials when activating this workspace.</div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="form-group">
          <label class="form-label">Primary CLI Terminal:</label>
          <select id="modal-ws-primary-cli" class="select-box">
            <option value="Hermes">Hermes CLI</option>
            <option value="ClaudeCode">Claude Code</option>
            <option value="AntigravityCli">Antigravity CLI</option>
            <option value="powershell">PowerShell</option>
            <option value="cmd">Command Prompt</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Secondary CLI Terminal:</label>
          <select id="modal-ws-secondary-cli" class="select-box">
            <option value="none">None (Single Pane)</option>
            <option value="powershell">PowerShell</option>
            <option value="cmd">Command Prompt</option>
            <option value="Hermes">Hermes CLI</option>
            <option value="ClaudeCode">Claude Code</option>
            <option value="AntigravityCli">Antigravity CLI</option>
          </select>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="form-group">
          <label class="form-label">Split Mode:</label>
          <select id="modal-ws-split-mode" class="select-box">
            <option value="single">Single Pane</option>
            <option value="horizontal">Horizontal Split (Left / Right)</option>
            <option value="vertical">Vertical Split (Top / Bottom)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Split Ratio:</label>
          <select id="modal-ws-split-ratio" class="select-box">
            <option value="0.5">50% / 50% Even</option>
            <option value="0.6">60% Primary / 40% Secondary</option>
            <option value="0.7">70% Primary / 30% Secondary</option>
          </select>
        </div>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--border-subtle);">
        <button class="btn btn-danger hidden" id="btn-delete-ws-modal" type="button">Delete Workspace</button>
        <div style="display: flex; gap: 8px; margin-left: auto;">
          <button class="btn btn-outline" id="btn-cancel-ws-modal" type="button">Cancel</button>
          <button class="btn btn-success" id="btn-save-ws-modal" type="button">Save Workspace</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Add Antigravity Profile -->
