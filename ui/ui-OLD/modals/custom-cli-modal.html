  <div id="modal-custom-cli" class="modal-overlay">
    <div class="modal-dialog" style="max-width: 520px;">
      <h3 style="font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 12px;">Add Custom AI CLI Engine</h3>
      <input type="hidden" id="modal-cli-id">

      <div class="form-group">
        <label class="form-label">Engine Name:</label>
        <input type="text" id="modal-cli-name" class="input-text" placeholder="e.g. Aider, Goose, Copilot CLI, Gemini CLI" />
      </div>

      <div class="form-group">
        <label class="form-label">Executable Command / Path:</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="modal-cli-exe" class="input-text" placeholder="e.g. aider, goose, python -m myagent" style="flex: 1; font-family: var(--font-mono); font-size: 12px;" />
          <button class="btn btn-outline" id="btn-browse-cli-exe" type="button" style="white-space: nowrap; padding: 6px 12px;">Browse...</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Default Launch Arguments:</label>
        <input type="text" id="modal-cli-args" class="input-text" placeholder="e.g. --model deepseek/deepseek-chat --auto-commits" style="font-family: var(--font-mono); font-size: 12px;" />
      </div>

      <div class="form-group">
        <label class="form-label">Working Directory (Optional):</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="modal-cli-dir" class="input-text" placeholder="Leave blank to use project workspace root" style="flex: 1; font-family: var(--font-mono); font-size: 12px;" />
          <button class="btn btn-outline" id="btn-browse-cli-dir" type="button" style="white-space: nowrap; padding: 6px 12px;">Browse...</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Tab Accent Color:</label>
        <input type="color" id="modal-cli-color" value="#38bdf8" style="height: 32px; width: 60px; background: transparent; border: 1px solid var(--border); border-radius: 4px; cursor: pointer;" />
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
        <button class="btn btn-outline" id="btn-cancel-custom-cli" type="button">Cancel</button>
        <button class="btn btn-primary" id="btn-save-custom-cli" type="button" style="background: #38bdf8; border-color: #38bdf8; color: #0b0f19; font-weight: 600;">Save CLI Engine</button>
      </div>
    </div>
  </div>

  <!-- Modal: Workspace File Activity & Diff Viewer -->
