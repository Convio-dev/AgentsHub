<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLI Terminal</title>
  <link rel="stylesheet" href="./xterm.css">
  <style>
    :root {
      --bg-terminal: #09090b;
      --bg-overlay: rgba(9, 9, 11, 0.92);
      --bg-card: #18181b;
      --border-subtle: #27272a;
      --text-main: #fafafa;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --accent-green: #4049B9;
      --accent-text: #ffffff;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-terminal);
      color: var(--text-main);
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      overflow: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    #terminal-container {
      width: 100%;
      height: 100%;
      padding: 6px 10px 8px 10px;
    }
    .xterm {
      width: 100%;
      height: 100%;
    }
    .xterm-viewport::-webkit-scrollbar {
      width: 8px;
    }
    .xterm-viewport::-webkit-scrollbar-track {
      background: var(--bg-terminal);
    }
    .xterm-viewport::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: 4px;
    }
    .xterm-viewport::-webkit-scrollbar-thumb:hover {
      background: var(--text-dim);
    }

    /* Offline / Ready Overlay */
    #offline-overlay {
      position: absolute;
      inset: 0;
      background: var(--bg-overlay);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }
    #offline-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .offline-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 28px 36px;
      text-align: center;
      max-width: 440px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .cli-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: var(--border-subtle);
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .cli-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .cli-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .btn-start {
      background: var(--accent-green);
      color: var(--accent-text);
      border: none;
      border-radius: 8px;
      padding: 10px 22px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn-start:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .btn-start:active {
      transform: translateY(0);
    }
    .status-text {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div id="terminal-container"></div>

  <div id="offline-overlay">
    <div class="offline-card">
      <div class="cli-badge" id="overlay-badge">CLI Terminal</div>
      <div class="cli-title" id="overlay-title">Terminal Offline</div>
      <div class="cli-desc" id="overlay-desc">Click below to start an interactive session directly inside this workspace.</div>
      <button class="btn-start" id="btn-start" onclick="handleStartClick()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <span id="btn-start-label">Start CLI</span>
      </button>
      <div class="status-text" id="overlay-status">Engine ready</div>
    </div>
  </div>

  <script src="./xterm.js"></script>
  <script src="./xterm-addon-fit.js"></script>
  <script>
    const container = document.getElementById('terminal-container');
    const overlay = document.getElementById('offline-overlay');
    const overlayBadge = document.getElementById('overlay-badge');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const btnStartLabel = document.getElementById('btn-start-label');
    const overlayStatus = document.getElementById('overlay-status');

    let isRunning = false;
    let cliName = 'CLI';

    const term = new Terminal({
      cursorBlink: true,
      cursorStyle: 'block',
      fontFamily: 'Cascadia Code, Fira Code, Consolas, monospace',
      fontSize: 13,
      lineHeight: 1.25,
      theme: {
        background: '#09090b',
        foreground: '#f4f4f5',
        cursor: '#10b981',
        cursorAccent: '#09090b',
        selectionBackground: 'rgba(16, 185, 129, 0.35)',
        black: '#18181b',
        red: '#ef4444',
        green: '#10b981',
        yellow: '#f59e0b',
        blue: '#3b82f6',
        magenta: '#d946ef',
        cyan: '#06b6d4',
        white: '#f4f4f5',
        brightBlack: '#71717a',
        brightRed: '#f87171',
        brightGreen: '#34d399',
        brightYellow: '#fbbf24',
        brightBlue: '#60a5fa',
        brightMagenta: '#e879f9',
        brightCyan: '#22d3ee',
        brightWhite: '#ffffff'
      },
      convertEol: true,
      allowProposedApi: true
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(container);

    const isWebView = Boolean(window.chrome && window.chrome.webview);
    let socket = null;

    function sendHostMessage(payload) {
      if (isWebView) {
        window.chrome.webview.postMessage(payload);
      } else if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify(payload));
      }
    }

    function reportResize() {
      try {
        fitAddon.fit();
        sendHostMessage({
          type: 'resize',
          cols: term.cols,
          rows: term.rows
        });
      } catch (e) {}
    }

    window.addEventListener('resize', () => {
      reportResize();
    });

    term.onData(data => {
      sendHostMessage({
        type: 'input',
        data: data
      });
    });

    function handleStartClick() {
      sendHostMessage({
        type: 'start'
      });
      overlayStatus.textContent = 'Launching process...';
    }

    function setRunningState(running, statusMsg) {
      isRunning = running;
      if (running) {
        overlay.classList.add('hidden');
        term.focus();
        setTimeout(reportResize, 50);
      } else {
        overlay.classList.remove('hidden');
        if (statusMsg) {
          overlayStatus.textContent = statusMsg;
        }
      }
    }

    function handleHostMessage(msg) {
      if (!msg) return;

      if (typeof msg === 'string') {
        term.write(msg);
        return;
      }

      switch (msg.type) {
        case 'output':
          if (msg.data) {
            term.write(msg.data);
          }
          break;

        case 'init':
          if (msg.name) {
            cliName = msg.name;
            overlayBadge.textContent = cliName;
            overlayTitle.textContent = `${cliName} Offline`;
            btnStartLabel.textContent = `Start ${cliName}`;
            document.title = `${cliName} Terminal`;
          }
          if (msg.history) {
            term.write(msg.history);
          }
          setRunningState(Boolean(msg.isRunning), msg.statusText);
          setTimeout(reportResize, 100);
          break;

        case 'status':
          setRunningState(Boolean(msg.isRunning), msg.statusText);
          break;

        case 'clear':
          term.clear();
          break;

        case 'focus':
          term.focus();
          break;

        case 'theme_changed':
          if (msg.theme || msg.accentColor) {
            applyTerminalTheme(msg.theme, msg.accentColor);
          }
          break;
      }
    }

    function hexToHsl(hex) {
      hex = (hex || '').replace(/^#/, '').trim();
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      if (hex.length !== 6) return { h: 236, s: 49, l: 49 };
      const r = parseInt(hex.substring(0, 2), 16) / 255;
      const g = parseInt(hex.substring(2, 4), 16) / 255;
      const b = parseInt(hex.substring(4, 6), 16) / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h = 0, s = 0, l = (max + min) / 2;
      if (max !== min) {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h = Math.round(h * 60);
      }
      return { h, s: Math.round(s * 100), l: Math.round(l * 100) };
    }

    function applyTerminalTheme(themeName, accentHex) {
      const isLight = themeName === 'light';
      const hex = accentHex || '#4049B9';
      const { h, s, l } = hexToHsl(hex);
      const root = document.documentElement.style;

      if (isLight) {
        root.setProperty('--bg-terminal', `hsl(${h}, 22%, 95.5%)`);
        root.setProperty('--bg-overlay', `hsla(${h}, 22%, 95.5%, 0.94)`);
        root.setProperty('--bg-card', '#ffffff');
        root.setProperty('--border-subtle', `hsl(${h}, 25%, 83%)`);
        root.setProperty('--text-main', `hsl(${h}, 28%, 11%)`);
        root.setProperty('--text-muted', `hsl(${h}, 16%, 36%)`);
        root.setProperty('--text-dim', `hsl(${h}, 10%, 52%)`);
        root.setProperty('--accent-green', hex);
        root.setProperty('--accent-text', l > 55 ? '#0a0f14' : '#ffffff');
      } else {
        root.setProperty('--bg-terminal', `hsl(${h}, 22%, 5.5%)`);
        root.setProperty('--bg-overlay', `hsla(${h}, 22%, 5.5%, 0.94)`);
        root.setProperty('--bg-card', `hsl(${h}, 26%, 12.5%)`);
        root.setProperty('--border-subtle', `hsl(${h}, 24%, 19%)`);
        root.setProperty('--text-main', '#f8fafc');
        root.setProperty('--text-muted', `hsl(${h}, 12%, 68%)`);
        root.setProperty('--text-dim', `hsl(${h}, 10%, 48%)`);
        root.setProperty('--accent-green', hex);
        root.setProperty('--accent-text', '#ffffff');
      }

      if (term) {
        term.options.theme = {
          background: isLight ? `hsl(${h}, 15%, 8%)` : `hsl(${h}, 22%, 5.5%)`,
          foreground: '#f4f4f5',
          cursor: hex,
          cursorAccent: isLight ? `hsl(${h}, 15%, 8%)` : `hsl(${h}, 22%, 5.5%)`,
          selectionBackground: `hsla(${h}, ${s}%, 50%, 0.35)`
        };
      }
    }

    // Apply saved theme immediately from localStorage
    const savedTheme = localStorage.getItem('agents_hub_theme') || 'dark';
    const savedAccent = localStorage.getItem('agents_hub_accent_color') || '#4049B9';
    applyTerminalTheme(savedTheme, savedAccent);

    if (isWebView) {
      window.chrome.webview.addEventListener('message', event => {
        handleHostMessage(event.data);
      });

      sendHostMessage({
        type: 'ready',
        cols: term.cols,
        rows: term.rows
      });
    } else {
      // Real Browser Mode via WebSocket
      function connectWebSocket() {
        const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        socket = new WebSocket(`${wsProto}//${location.host}/ws`);

        socket.onopen = () => {
          sendHostMessage({
            type: 'ready',
            cols: term.cols,
            rows: term.rows
          });
        };

        socket.onmessage = event => {
          try {
            const data = JSON.parse(event.data);
            handleHostMessage(data);
          } catch (e) {
            term.write(event.data);
          }
        };

        socket.onclose = () => {
          setTimeout(connectWebSocket, 1500);
        };
      }

      connectWebSocket();
    }

    setTimeout(reportResize, 80);
  </script>
</body>
</html>
