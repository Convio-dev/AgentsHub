<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Engine Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 36px 44px;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      color: #a1a1aa;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      background: #10b981;
      color: #09090b;
      border: none;
      border-radius: 6px;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn:hover {
      background: #059669;
      transform: translateY(-1px);
    }
    .port-info {
      margin-top: 20px;
      font-size: 12px;
      color: #71717a;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Engine Offline</div>
    <h1>Hermes Agent Dashboard</h1>
    <p>The local Hermes daemon is not currently running. Launch the engine to start chatting and managing agent sessions.</p>
    <button class="btn" onclick="startHermes()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      Start Hermes Engine
    </button>
    <div class="port-info" id="port-label">Target Port: 9119</div>
  </div>

  <script>
    function startHermes() {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ type: 'start_hermes' });
      }
      document.querySelector('.badge').textContent = 'Starting...';
      document.querySelector('.badge').style.color = '#f59e0b';
      document.querySelector('.badge').style.borderColor = '#f59e0b';
    }
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.addEventListener('message', e => {
        if (e.data && e.data.port) {
          document.getElementById('port-label').textContent = 'Target Port: ' + e.data.port;
        }
      });
    }
  </script>
</body>
</html>
